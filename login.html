<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="img/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon/favicon-16x16.png">
    <link rel="manifest" href="img/favicon/site.webmanifest">
    <link rel="stylesheet" href="css/login.css">
    <script src="https://kit.fontawesome.com/b4a10257e6.js" crossorigin="anonymous"></script>
    <title>Login</title>
</head>
<body>
    <section>
        <div class="container">
            <!-- contenido -->
            <div class="container-content">
                <a href="index.html" class="back">
                    <i class="fa-solid fa-circle-chevron-left" style="color: rgb(0, 0, 0);"></i>
                </a>            
                <div class="content">
                    <h2>Inicio de sesión</h2>
                    <form action="">
                        <label for="email">Email:</label>
                        <input type="email" id="email" placeholder="calu@hotmail.com" required>
                        <label for="password">Contrseña:</label>
                        <input type="password" id="password" placeholder="******" required>
                        <button type="submit">Iniciar Sesión</button>
                    </form>
                    <p>No tenes una cuenta? <a href="registro.html">Registrate</a></p>
                </div>
            </div>

            <!-- foto -->
            <div class="container-image">
            </div>
        </div>
    </section>
</body>
</html>
