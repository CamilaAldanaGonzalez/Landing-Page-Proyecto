<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="img/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon/favicon-16x16.png">
    <link rel="stylesheet" href="css/login.css">
    <script src="https://kit.fontawesome.com/b4a10257e6.js" crossorigin="anonymous"></script>
    <title>Registro</title>
</head>
<body>
    <section>
        <div class="container">

            <!-- registro -->
            <div class="container-content">
                <a href="index.html" class="back">
                    <i class="fa-solid fa-circle-chevron-left" style="color: rgb(0, 0, 0);"></i>
                </a>
                <div class="content">
                    <h2>Registrate</h2>
                    <form action="">
                        <label for="nombre">Nombre:</label>
                        <input type="text" name="" id="nombre" placeholder="Camila" required>
                        <label for="apellido">Apellido:</label>
                        <input type="text" name="" id="apellido" placeholder="Gonzalez" required>
                        <label for="email">Email:</label>
                        <input type="email" name="" id="email" placeholder="calu@hotmail.com" required>
                        <label for="password">Contraseña:</label>
                        <input type="password" name="" id="password" placeholder="******" required>
                        <button type="submit">Crear Cuenta</button>
                    </form>
                    <p>Ya tenes una cuenta? <a href="login.html">Iniciar Sesión</a></p>
                </div>
            </div>

             <!-- foto -->
            <div class="container-image">
            </div>
        </div>
    </section>
</body>
</html>
